<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PickWise AI — Picker {{ picker_id }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .task-completed {
      opacity: 0.55;
    }
    .task-active {
      border-left: 4px solid #2563eb;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center">
          <span class="text-white font-bold text-sm">PW</span>
        </div>
        <div>
          <p class="text-xs text-blue-600 uppercase tracking-wider font-semibold leading-tight">PickWise AI</p>
          <p class="text-sm font-bold text-gray-900 leading-tight">Daftar Tugas</p>
        </div>
      </div>
      <span class="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-medium">Picker {{ picker_id }}</span>
    </div>
  </header>

  <main class="flex-1 max-w-md mx-auto w-full px-4 py-5 space-y-4">

    <!-- Profile Card -->
    <section class="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 rounded-lg bg-blue-50 flex items-center justify-center">
          <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </div>
        <div class="flex-1">
          <p class="text-sm font-bold text-gray-900">Picker {{ picker_id }}</p>
          <p class="text-xs text-gray-500">Shift Pagi • Troli 04</p>
        </div>
      </div>
      <div class="flex flex-wrap gap-1.5">
        <span class="text-xs bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full">Zona A-D</span>
        <span class="text-xs bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full">Rute Optimal</span>
      </div>
    </section>

    <!-- Progress Card -->
    <section class="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
      <div class="flex items-center justify-between mb-2">
        <p class="text-sm font-semibold text-gray-700">Progres Pemetikan</p>
        <p id="progressText" class="text-sm font-bold text-green-600">— / —</p>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
        <div id="progressBar" class="bg-green-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>
      <p id="progressDetail" class="text-xs text-gray-500 mt-2">Memuat...</p>
    </section>

    <!-- Task List -->
    <section>
      <div class="flex items-center justify-between mb-3 px-1">
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Daftar Antrean</p>
        <p id="taskCount" class="text-xs bg-gray-200 text-gray-700 px-2 py-0.5 rounded-full">0 Item</p>
      </div>
      <div id="tasks" class="space-y-3">
        <p class="text-sm text-gray-400 text-center py-8">Memuat tugas...</p>
      </div>
    </section>

  </main>

  <script>
    const pickerId = {{ picker_id }};
    let tasks = [];

    async function loadTasks() {
      try {
        const res = await fetch(`/picker/${pickerId}/tasks`);
        if (!res.ok) throw new Error('Gagal memuat tugas');
        tasks = await res.json();
        renderTasks();
      } catch (err) {
        document.getElementById('tasks').innerHTML = `<p class="text-sm text-red-600 text-center py-8">${err.message}</p>`;
      }
    }

    function renderTasks() {
      const container = document.getElementById('tasks');
      const count = document.getElementById('taskCount');

      count.textContent = `${tasks.length} Item`;

      if (!tasks.length) {
        container.innerHTML = '<p class="text-sm text-gray-400 text-center py-8">Belum ada tugas. Supervisor belum menjalankan optimize.</p>';
        updateProgress();
        return;
      }

      container.innerHTML = tasks.map(t => {
        const isDone = t.status === 'completed';
        const isFirstPending = !isDone && tasks.findIndex(x => x.status !== 'completed') === tasks.indexOf(t);
        return `
          <article class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex items-center justify-between gap-3 transition-all ${isDone ? 'task-completed' : ''} ${isFirstPending ? 'task-active' : ''}">
            <div class="flex items-start gap-3 min-w-0">
              <div class="w-9 h-9 rounded-lg ${isDone ? 'bg-green-50 text-green-600' : 'bg-blue-50 text-blue-600'} flex items-center justify-center shrink-0">
                ${isDone
                  ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'
                  : '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>'}
              </div>
              <div class="min-w-0">
                <p class="text-sm font-bold text-gray-900">Task ${t.task_id}: ${t.sku}</p>
                <div class="flex items-center gap-2 mt-1">
                  <span class="text-xs bg-gray-100 text-gray-700 px-2 py-0.5 rounded font-medium">Bin ${t.bin_location}</span>
                  <span class="text-xs text-gray-500">Qty ${t.qty || 1}</span>
                </div>
              </div>
            </div>
            <div class="shrink-0">
              ${isDone
                ? '<span class="inline-flex items-center gap-1 bg-green-100 text-green-700 px-3 py-1.5 rounded-full text-xs font-medium">✓ Selesai</span>'
                : `<button onclick="completeTask(${t.task_id})" class="inline-flex items-center gap-1 bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-xs font-medium transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                    Selesaikan
                  </button>`}
            </div>
          </article>
        `;
      }).join('');

      updateProgress();
    }

    async function completeTask(id) {
      try {
        const res = await fetch(`/tasks/${id}/complete`, { method: 'POST' });
        if (!res.ok) throw new Error('Gagal menyelesaikan task');
        await loadTasks();
      } catch (err) {
        alert(err.message);
      }
    }

    function updateProgress() {
      const total = tasks.length;
      const done = tasks.filter(t => t.status === 'completed').length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById('progressText').textContent = `${done} / ${total} (${pct}%)`;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressDetail').textContent = total
        ? `${done} selesai, ${total - done} tersisa`
        : 'Belum ada tugas';
    }

    loadTasks();
  </script>

</body>
</html>
